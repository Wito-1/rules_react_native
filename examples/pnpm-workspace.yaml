packages:
  - "hello"
  - "cxx_module"
  - "ecosystem"
  - "native_modules"
  - "third_party"
  - "variants"
  - "assets"
  - "brownfield"
  - "connect/mobile"
  - "connect/proto"
  - "connect/server"
  - "connect/web"
  - "fleet/driver"
  - "fleet/operator"
  - "fleet/shared"

# No dependency needs install scripts; rules_js requires the list to be explicit.
onlyBuiltDependencies: []

# @react-native/jest-preset requires react-native (and react) from its own location without
# declaring them; declaring them as peers makes pnpm link the app's copies next to it.
packageExtensions:
  "@react-native/jest-preset":
    peerDependencies:
      react: "*"
      react-native: "*"
